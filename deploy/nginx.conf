# Reverse proxy for agent-artifacts. Replace art.example.org and the
# certificate paths; the app listens on 127.0.0.1:8090 (compose.yaml).
# Everything except the zones below is set per server, so other sites in the
# same nginx are not affected.

# Per client IP: viewing (a view is two requests: the page and the content)
# and the agent API, which is cheap to call but writes to disk.
limit_req_zone $binary_remote_addr zone=aa_view:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aa_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=aa_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name art.example.org;
    # Request lines carry the links, which are the access to the files.
    access_log off;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;  # nginx 1.25.1+; older: "listen 443 ssl http2;" on both lines
    server_name art.example.org;
    access_log off;

    ssl_certificate     /etc/ssl/art.example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/art.example.org/key.pem;

    # A bit above AA_MAX_FILE_MB (25 MB) for the multipart framing.
    client_max_body_size 26m;
    client_body_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_conn aa_conn 20;
    limit_conn_status 429;
    limit_req_status 429;
    # Rejections are logged with the request line, i.e. the link; at warn they
    # stay below the default error_log level.
    limit_conn_log_level warn;
    limit_req_log_level warn;

    proxy_set_header Host $host;
    proxy_request_buffering on;
    proxy_read_timeout 60s;

    location / {
        limit_req zone=aa_view burst=40 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }

    location /api/ {
        limit_req zone=aa_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }
}
