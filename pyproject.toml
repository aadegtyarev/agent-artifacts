[project]
name = "agent-artifacts"
version = "0.1.0"
description = "Share files from AI agents as short-lived links"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Degtyarev", email = "adegtyarev.ap@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.10",
    "uvicorn>=0.54",
    "python-multipart>=0.0.34",
    "jinja2>=3.1",
    "google-auth>=2.40",
    "requests>=2.32",
]

[project.scripts]
agent-artifacts = "agent_artifacts.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
    "ruff>=0.14",
    "cryptography>=44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]
