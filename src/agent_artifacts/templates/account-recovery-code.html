{% extends "base.html" %}
{% import "icons.html" as icon %}
{% block body %}
<main class="join account-page">
  <h1>Save your recovery code</h1>
  <p>Keep this code somewhere safe, away from this browser. It works once and is only shown here.</p>
  <p>Anyone with the code can restore access to your account.</p>
  <div class="account-form">
    <label for="setup">Recovery code</label>
    <input id="setup" type="text" readonly autocomplete="off" spellcheck="false" value="{{ code }}">
    <button type="button" class="btn pri" data-copy="setup"><span>Copy code</span>{{ icon.check() }}</button>
  </div>
  <p><a href="/account">Back to your account</a></p>
</main>
{% endblock %}
