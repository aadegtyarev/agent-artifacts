<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ static['site.css'] }}">
<link rel="stylesheet" id="dark-css" href="{{ static['dark.css'] }}" media="(prefers-color-scheme: dark)">
<script src="{{ static['theme.js'] }}"></script>
</head><body>
{% block body %}{% endblock %}
{% if copy %}<script src="{{ static['copy.js'] }}"></script>{% endif %}
{% if viewer %}<script src="{{ static['pin-marks.js'] }}"></script>
<script src="{{ static['comments.js'] }}"></script>
<script src="{{ static['viewer.js'] }}"></script>{% endif %}
</body></html>
