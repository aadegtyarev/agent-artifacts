<!doctype html>
{#- The Markdown source and a renderer; the viewer's browser does the work,
    inside the sandbox, so everything is inline. #}
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
body{max-width:820px;margin:0 auto;padding:24px 16px;font:16px/1.6 system-ui,sans-serif;color:#1d1d1f;background:#fff}
pre,code{background:#f2f2f4;border-radius:4px}pre{padding:12px;overflow:auto}
code{padding:1px 4px}pre code{padding:0}table{border-collapse:collapse}
th,td{border:1px solid #d2d2d7;padding:4px 8px}img{max-width:100%}
blockquote{margin:0;padding-left:12px;border-left:3px solid #d2d2d7;color:#6e6e73}
</style></head><body>
<script>{{ marked }}</script>
<script>{{ links }}</script>
<script>
const SOURCE = {{ source }};
document.body.innerHTML = marked.parse(SOURCE);
// Heading ids for #anchor links, and links to other sites in a new tab (the
// only way out of the sandbox). Links to other files of the service stay in
// this tab: the pin script asks the viewer to open them in its own.
const seen = {};
for (const h of document.querySelectorAll("h1,h2,h3,h4,h5,h6")) {
  const slug = h.textContent.toLowerCase().trim()
    .replace(/[^\p{L}\p{N}\- ]/gu, "").replace(/ /g, "-") || "section";
  const n = seen[slug] = (seen[slug] || 0) + 1;
  h.id = n > 1 ? `${slug}-${n - 1}` : slug;
}
for (const a of document.querySelectorAll("a[href]")) {
  const href = a.getAttribute("href");
  if (!href.startsWith("#") && !pageLinks.target(href, location.href)) { a.target = "_blank"; a.rel = "noopener"; }
}
// Opened at a #fragment (a link from another file, which can only pass
// one of plain ASCII): the headings have their ids only now.
const at = location.hash && document.getElementById(location.hash.slice(1));
if (at) at.scrollIntoView();
</script>
{{ pins }}</body></html>
