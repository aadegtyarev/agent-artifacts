{% extends "base.html" %}
{% import "icons.html" as icon %}
{% import "files.html" as files %}
{% block body %}
<header>
  <div class="name">
    <h1 title="{{ project.title }}">{{ project.title }}</h1>
    <div class="meta">{{ count }} · kept until deleted</div>
  </div>
  <div class="actions">
    <button type="button" id="full-button" class="sq" title="Full screen" aria-label="Full screen">{{ icon.expand() }}</button>
    <button type="button" id="menu-button" class="sq" aria-haspopup="menu" aria-controls="fan" aria-expanded="false" title="Menu" aria-label="Menu">{{ icon.menu() }}</button>
  </div>
</header>
{#- The viewer's menu and full screen (viewer.js), without what is about one file. #}
<div id="fan" class="fan" hidden>
  <div class="fan-scrim"></div>
  <div id="fan-list" class="fan-list" role="menu" aria-label="Menu">
    <button type="button" role="menuitem" class="fan-item" data-act="exit" data-when="full"><span class="fan-label">Exit full screen</span><span class="fan-sq">{{ icon.shrink() }}</span></button>
    <button type="button" role="menuitem" class="fan-item" data-act="copy" data-url="{{ url }}"><span class="fan-label">Copy link</span><span class="fan-sq">{{ icon.link() }}</span></button>
    <button type="button" role="menuitem" class="fan-item" data-act="theme"><span class="fan-label" id="theme-label">Theme: Auto</span><span class="fan-sq">{{ icon.theme() }}</span></button>
  </div>
</div>
<button type="button" id="float-button" class="float-button" hidden aria-haspopup="menu" aria-controls="fan" aria-expanded="false" title="Menu" aria-label="Menu">{{ icon.menu() }}{{ icon.close() }}</button>
<main id="files" class="pj" data-project="{{ project.id }}">
{{- files.rows(rows) }}
</main>
<div id="toast" class="toast" role="status" aria-live="polite"><div class="toast-box"><span id="toast-text"></span></div></div>
{% endblock %}
