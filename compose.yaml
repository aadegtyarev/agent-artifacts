services:
  app:
    build: .
    image: agent-artifacts:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AA_PORT:-8090}:8090"
    environment:
      AA_PUBLIC_URL: ${AA_PUBLIC_URL:?set AA_PUBLIC_URL, e.g. https://art.example.org}
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  data:
