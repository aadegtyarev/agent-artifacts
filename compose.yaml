services:
  app:
    build: .
    image: agent-artifacts:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AA_PORT:-8090}:8090"
    environment:
      AA_PUBLIC_URL: ${AA_PUBLIC_URL:?set AA_PUBLIC_URL, e.g. https://art.example.org}
      AA_RAW_URL: ${AA_RAW_URL:-}
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m
    mem_limit: 512m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
