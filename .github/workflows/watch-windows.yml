name: Durable watch on Windows

on:
  pull_request:
    paths:
      - 'skill/agent-artifacts/scripts/*.py'
      - 'tests/test_reliable_watch_process.py'
      - '.github/workflows/watch-windows.yml'
  push:
    branches: [main]
    paths:
      - 'skill/agent-artifacts/scripts/*.py'
      - 'tests/test_reliable_watch_process.py'
      - '.github/workflows/watch-windows.yml'

permissions:
  contents: read

jobs:
  windows-watch:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b3 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q tests/test_reliable_watch_process.py
